[package]
name = "nostr-onion-messenger"
version = "0.1.0"
description = "Nostr NIP-29 onion routed relay messenger"
authors = ["you"]
edition = "2021"

[lib]
name = "nostr_onion_messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
